<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrinho - CentroSport</title>

  <!-- Bootstrap CSS para facilitar responsividade -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />

  <!-- Fonte personalizada -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../../style/loja/carrinho.css" />
</head>

<body>
  <div class="conteudo-principal container d-flex flex-column min-vh-100 py-3">
    <header class="d-flex align-items-center justify-content-between mb-4">
      <a href="./loja.html" class="botao-voltar text-decoration-none fs-2" aria-label="Voltar">⬅</a>
      <h1 class="titulo-central flex-grow-1 text-center m-0">CentroSport</h1>
      <div style="width: 40px;"></div> <!-- Espaço para balancear o header -->
    </header>

    <div class="logo text-center mb-4">
      <img src="../../img/logo.png" alt="logo CentroSport" class="img-fluid" style="max-height: 100px;" />
    </div>

    <h2 class="titulo mb-4 text-center">CARRINHO:</h2>

    <div class="container-itens-carrinho d-flex flex-column gap-3 mb-4">
      <div class="item-carrinho d-flex flex-column flex-md-row align-items-center gap-3 p-3 rounded shadow-sm"
        style="background-color: rgba(24, 24, 24, 0.8);">
        <div class="imagem-item flex-shrink-0 text-center" style="max-width: 120px;">
          <img src="../../img/loja/creatina.jpg" alt="Creatina" class="img-fluid" style="height: 80px; object-fit: contain;" />
        </div>
        <div class="detalhes-item flex-grow-1 text-center text-md-start">
          <p class="m-0 fw-bold fs-5" style="font-family: 'Anton', sans-serif; color: #fff; line-height: 1.3;">
            CREATINA<br />
            300 GRAMAS<br />
            R$ 55,00
          </p>
        </div>
        <div class="controle-quantidade d-flex align-items-center gap-2 mt-3 mt-md-0 rounded"
          style="background-color: #fb8903; padding: 5px 10px;">
          <button type="button" aria-label="Diminuir quantidade" class="btn-quantidade btn btn-sm">-</button>
          <span class="quantidade fs-5 fw-bold text-white" style="min-width: 25px; text-align: center;">1</span>
          <button type="button" aria-label="Aumentar quantidade" class="btn-quantidade btn btn-sm">+</button>
        </div>
      </div>
      <!-- Adicione mais itens aqui seguindo o mesmo padrão -->
    </div>

    <div class="info-endereco bg-warning text-dark rounded py-2 px-3 mb-3 text-center fw-bold" style="font-family: 'Anton', sans-serif;">
      AVENIDA BRASIL, 312, ARARAQUARA-SP
    </div>

    <div class="info-total bg-warning text-dark rounded py-3 px-4 mb-4 mx-auto fw-bold text-center" style="font-family: 'Anton', sans-serif; max-width: 320px;">
      TOTAL = R$ 55,00
    </div>

    <button class="botao-finalizar btn btn-success btn-lg mx-auto d-block mb-4" style="max-width: 320px; font-family: 'Anton', sans-serif; font-weight: 700;">
      FINALIZAR PEDIDO
    </button>

    <footer class="mt-auto text-center text-white pb-3">
      <p class="mb-0">© 2025 CentroSport</p>
    </footer>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
<script>
  document.querySelector(".botao-finalizar").addEventListener("click", () => {
    const itens = document.querySelectorAll(".item-carrinho");
    const pedido = [];

    let total = 0;

    itens.forEach(item => {
      const nome = item.querySelector("p").innerText.trim().replace(/\s+/g, " ");
      const quantidade = parseInt(item.querySelector(".quantidade").innerText.trim());
      const precoMatch = nome.match(/R\$ ?(\d+,\d{2})/);
      const preco = precoMatch ? parseFloat(precoMatch[1].replace(",", ".")) : 0;

      pedido.push({
        nome: nome,
        quantidade: quantidade,
        precoUnitario: preco,
        subtotal: (preco * quantidade).toFixed(2)
      });

      total += preco * quantidade;
    });

    localStorage.setItem("pedidoFinalizado", JSON.stringify({
      itens: pedido,
      total: total.toFixed(2)
    }));

    window.location.href = "loja.html";
  });
</script>


</html>
