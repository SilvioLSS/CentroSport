<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escolher Treino - CentroSport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="/style/style.css" />
  <link rel="stylesheet" href="/style/layout.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

  <style>
    .botao-personalizado {
      background-color: #000;
      color: #fff;
      border: 2px solid #FB8903;
      padding: 1rem;
      border-radius: 12px;
      text-decoration: none;
      display: block;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      transition: background-color 0.3s, color 0.3s;
    }

    .botao-personalizado:hover {
      background-color: #FB8903;
      color: #000;
    }

    .titulo-central {
      font-family: 'Anton', sans-serif;
      letter-spacing: 1.5px;
      color: #fb8903;
    }

    @media (max-width: 576px) {
      .titulo {
        font-size: 1.1rem;
      }

      .botao-personalizado {
        font-size: 1.1rem;
        padding: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <div class="container-fluid p-0 min-vh-100 d-flex flex-column">
    <!-- Cabeçalho -->
    <header class="d-flex align-items-center justify-content-between p-3 bg-dark text-white">
      <a href="./superiores.html" class="text-white text-decoration-none fs-1" aria-label="Voltar">⬅</a>
      <img src="../../img/logo.png" alt="Logo CentroSport" class="img-fluid" style="max-height: 60px;">
      <h1 class="m-0 text-center flex-grow-1 fs-4 d-none d-md-block">TREINOS CENTROSPORT</h1>
      <div style="width: 48px;"></div>
    </header>

    <!-- Conteúdo principal -->
    <main class="flex-grow-1 px-3 mt-4">
      <p class="titulo fw-bold text-center mb-4 fs-5">
        ESCOLHA A TABELA DE TREINOS<br class="d-none d-md-block" />QUE DESEJA VISUALIZAR
      </p>

      <div class="row w-100 justify-content-center g-3">
        <div class="col-12 col-md-5">
          <a href="superiores.html" class="botao-personalizado">MEMBROS SUPERIORES</a>
        </div>
        <div class="col-12 col-md-5">
          <a href="tabela_inferiores.html" class="botao-personalizado">MEMBROS INFERIORES</a>
        </div>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-center text-white py-3 mt-auto">
      <p class="mb-0">© 2025 CentroSport</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>

</html>
