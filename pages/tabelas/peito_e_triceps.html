<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peito e Tríceps - CentroSport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../style/style.css" />
  <link rel="stylesheet" href="../../style/layout.css" />

  <style>
    body {
      background-color: #111;
      color: white;
    }

    .titulo {
      font-weight: bold;
      text-align: center;
      margin: 1.5rem 0;
      color: white;
    }

    .categoria {
      font-weight: bold;
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #FB8903;
    }

    ul.lista-exercicios {
      list-style: none;
      padding: 0;
    }

    ul.lista-exercicios li {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    ul.lista-exercicios input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
      accent-color: #FB8903;
      cursor: pointer;
    }

    ul.lista-exercicios input[type="checkbox"]:checked+label span {
      text-decoration: line-through;
      color: gray;
    }

    label {
      cursor: pointer;
    }

    .btn-controle {
      margin: 10px 5px;
    }

    .botoes-controle {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    li:hover span {
      color: #FB8903;
      transition: 0.2s;
    }
  </style>
</head>

<body>
  <div class="container-fluid p-0 min-vh-100 d-flex flex-column">

    <!-- Cabeçalho -->
    <header class="d-flex align-items-center justify-content-between p-3 bg-dark text-white">
      <a href="./superiores.html" class="text-white text-decoration-none fs-1" aria-label="Voltar">⬅</a>
      <img src="../../img/logo.png" alt="Logo CentroSport" class="img-fluid" style="max-height: 60px;">
      <h1 class="m-0 text-center flex-grow-1 fs-4 d-none d-md-block">TREINOS CENTROSPORT</h1>
      <div style="width: 48px;"></div>
    </header>

    <!-- Conteúdo -->
    <main class="flex-grow-1 px-3 mt-4">
      <p class="titulo fs-5">EXERCÍCIOS PARA PEITO E TRÍCEPS</p>

      <div class="container" id="conteudo-exercicios"></div>

      <div class="botoes-controle">
        <button class="btn btn-warning btn-controle" onclick="marcarTodos()">Marcar Todos</button>
        <button class="btn btn-secondary btn-controle" onclick="desmarcarTodos()">Desmarcar Todos</button>
        <button class="btn btn-success btn-controle" onclick="salvarProgresso()">Salvar Progresso</button>
        <button class="btn btn-danger btn-controle" onclick="limparProgresso()">Limpar Progresso</button>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p class="mb-0">© 2025 CentroSport</p>
    </footer>
  </div>
  <script>
    const treinoId = "peitoTriceps";
    const dadosExercicios = [
      {
        categoria: "Exercícios de Peito",
        itens: ["Supino Reto", "Supino Inclinado", "Supino Declinado", "Crucifixo", "Pullover"]
      },
      {
        categoria: "Músculos Trabalhados (Peito)",
        itens: ["Peitoral Maior", "Peitoral Menor", "Serrátil Anterior"]
      },
      {
        categoria: "Exercícios de Tríceps",
        itens: ["Tríceps Testa", "Tríceps na Polia", "Tríceps Banco", "Tríceps Coice"]
      },
      {
        categoria: "Músculos Trabalhados (Tríceps)",
        itens: ["Cabeça Longa", "Cabeça Medial", "Cabeça Lateral"]
      }
    ];
  </script>
  <script src="../../js/treinos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
